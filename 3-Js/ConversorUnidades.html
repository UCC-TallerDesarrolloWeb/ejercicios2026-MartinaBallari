<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Convertidor de Unidades</title>
    <link href="https://fonts.googleapis.com/css?family=Inknut+Antiqua" rel="stylesheet">
    <link href="miEstilo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="misFunciones.js"></script>
</head>
<body class="body-num">

<div class="centrado div-conver">
    <h1>Convertidor de Unidades</h1>
    <form name="conversor">
        <p>
            <label for="metro">metro=</label> <input id="metro" type="text" name="unid_metro" onchange="convertirUnidades(this.name, this.value)">
        </p>
        <p>
            <label for="pulgada">pulgada=</label> <input id="pulgada" type="text" name="unid_pulgada" onchange="convertirUnidades(this.name, this.value)">
        </p>
        <p>
            <label for="pie">pie=</label> <input id="pie" type="text" name="unid_pie" onchange="convertirUnidades(this.name, this.value)">
        </p>
        <p>
            <label for="yarda">yarda=</label> <input id="yarda" type="text" name="unid_yarda" onchange="convertirUnidades(this.name, this.value)">
        </p>
    </form>
</div>

</body>
</html>
