```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <link href="catalogo.css" type="text/css" rel="stylesheet">
</head>

<body class="grid-container">

    <header class="item1">
        Catálogo de Productos
    </header>

    <nav class="item2">
        <a href="carrito.html">
            Ver Mi Carrito (<span id="contadorCarrito">0</span>)
        </a>
    </nav>

    <aside class="item3">
        <form onsubmit="return false;">
            <fieldset>
                <legend>Búsqueda</legend>
                <label for="buscar">Buscar:</label>
                <input type="text" id="buscar" name="buscar">
            </fieldset>

            <fieldset>
                <legend>Precios</legend>
                <p>
                    <label for="minimo">Mínimo:</label>
                    <input type="number" id="minimo" name="minimo" min="0">
                </p>
                <p>
                    <label for="maximo">Máximo:</label>
                    <input type="number" id="maximo" name="maximo" min="0">
                </p>
            </fieldset>

            <fieldset>
                <legend>Marca</legend>
                <label for="marca">Seleccionar marca:</label>
                <select id="marca" name="marca">
                    <option value="">Todas las marcas</option>
                    <option value="Adidas">Adidas</option>
                    <option value="Daedo">Daedo</option>
                    <option value="Kwon">Kwon</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Tipo de Productos</legend>
                <p>
                    <input type="checkbox" id="protectores" name="tipo" value="protectores">
                    <label for="protectores">Protectores</label>
                </p>
                <p>
                    <input type="checkbox" id="entrenamiento" name="tipo" value="entrenamiento">
                    <label for="entrenamiento">Entrenamiento</label>
                </p>
                <p>
                    <input type="checkbox" id="doboks" name="tipo" value="doboks">
                    <label for="doboks">Doboks</label>
                </p>
            </fieldset>

            <fieldset>
                <legend>Ordenar catálogo</legend>
                <label for="ordenar">Ordenar por:</label>
                <select id="ordenar" name="ordenar">
                    <option value="">Sin ordenar</option>
                    <option value="precioAsc">Precio: menor a mayor</option>
                    <option value="precioDesc">Precio: mayor a menor</option>
                    <option value="nombreAsc">Nombre: A-Z</option>
                    <option value="nombreDesc">Nombre: Z-A</option>
                </select>
            </fieldset>
        </form>
    </aside>

    <!-- Contenedor dinámico de productos -->
    <main class="item4" id="contenedorProductos"></main>

    <!-- Modal Dialog para detalle de productos -->
    <dialog id="dialogDetalle">
        <div id="contenidoDialog"></div>
        <br>
        <button onclick="cerrarDialog()">Cerrar</button>
    </dialog>

    <footer class="item5">
        Contacto
    </footer>

    <script src="tienda.js"></script>
</body>
</html>
```
