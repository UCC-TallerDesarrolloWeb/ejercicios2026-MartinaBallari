<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
        fieldset {
            margin-bottom: 15px;
            padding: 10px;
        }
        label {
            display: inline-block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form action="#" method="post">

    <!-- Datos Personales -->
    <fieldset>
        <legend>Datos Personales</legend>
        
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </p>

        <p>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>
        </p>

        <p>
            <label>Sexo:</label>
            <input type="radio" id="masculino" name="sexo" value="masculino">
            <label for="masculino">Masculino</label>
            
            <input type="radio" id="femenino" name="sexo" value="femenino">
            <label for="femenino">Femenino</label>
        </p>

        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" max="120">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>
    </fieldset>

    <!-- Cuenta de Usuario -->
    <fieldset>
        <legend>Cuenta de Usuario</legend>

        <p>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </p>

        <p>
            <label for="confirm_password">Confirmar Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </p>
    </fieldset>

    <!-- Preferencias de Suscripción -->
    <fieldset>
        <legend>Preferencias de Suscripción</legend>

        <p>
            <label for="servicio">Tipo de servicio:</label>
            <select id="servicio" name="servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>
            <label>Tema de Interés:</label><br>
            <input type="checkbox" id="politica" name="tema" value="politica">
            <label for="politica">Política</label><br>

            <input type="checkbox" id="negocios" name="tema" value="negocios">
            <label for="negocios">Negocios</label><br>

            <input type="checkbox" id="tecnologia" name="tema" value="tecnologia">
            <label for="tecnologia">Tecnología</label><br>

            <input type="checkbox" id="salud" name="tema" value="salud">
            <label for="salud">Salud</label>
        </p>

        <p>
            <label for="comentario">Agregue un comentario:</label><br>
            <textarea id="comentario" name="comentario" rows="4" cols="40"></textarea>
        </p>
    </fieldset>

    <!-- Botón de Envío -->
    <button type="submit">Enviar</button>

</form>

</body>
</html>
