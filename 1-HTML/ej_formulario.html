<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form name="form-suscripcion">

    <fieldset>
        <legend>Datos Personales</legend>

        <p><label for="nombre">Nombre:</label> <input type="text" id="nombre" name="nombre" placeholder="ingrese su nombre" size="40" maxlength="40"></p>
        
        <p><label for="apellido">Apellido:</label> <input type="text" id="apellido" name="apellido" placeholder="ingrese su apellido" size="40" maxlength="40"></p>
        
        <p>Sexo: 
            <input type="radio" id="sex_masculino" name="sex" value="masculino"> <label for="sex_masculino">Masculino</label> 
            <input type="radio" id="sex_femenino" name="sex" value="femenino"> <label for="sex_femenino">Femenino</label>
        </p>
        
        <p><label for="edad">Edad:</label> <input type="number" id="edad" name="edad" placeholder="edad" maxlength="3"></p>
    </fieldset>

    <fieldset>
        <legend>Datos de la Cuenta</legend>

        <p><label for="email">Email:</label> <input type="email" id="email" name="email" placeholder="usuario@dominio.com" size="40" maxlength="50"></p>
        
        <p><label for="usuario">Usuario:</label> <input type="text" id="usuario" name="usuario" placeholder="nombre de usuario" size="40" maxlength="20"></p>
        
        <p><label for="password">Password:</label> <input type="password" id="password" name="password" placeholder="contraseña" size="40" maxlength="20"></p>
        
        <p><label for="confirm_password">Confirmar Password:</label> <input type="password" id="confirm_password" name="confirm_password" placeholder="contraseña" size="40" maxlength="20"></p>
    </fieldset>

    <fieldset>
        <legend>Tipo de Suscripción</legend>

        <p><label for="tipo-servicio">Tipo de servicio:</label> 
            <select id="tipo-servicio" name="tipo-servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>Tema:
            <input type="checkbox" id="politica" name="tema" value="politica"> <label for="politica">Política</label> 
            <input type="checkbox" id="negocios" name="tema" value="negocios"> <label for="negocios">Negocios</label> 
            <input type="checkbox" id="tecnologia" name="tema" value="tecnologia"> <label for="tecnologia">Tecnología</label> 
            <input type="checkbox" id="salud" name="tema" value="salud"> <label for="salud">Salud</label>
        </p>

        <p><label for="comentario">Agregue un comentario:</label><br>
            <textarea id="comentario" name="comentario" rows="4" cols="50" placeholder="Escriba su comentario aquí..." maxlength="250"></textarea>
        </p>
    </fieldset>

    <p><input type="submit" value="Boton de Enviar"></p>

</form>

</body>
</html>
