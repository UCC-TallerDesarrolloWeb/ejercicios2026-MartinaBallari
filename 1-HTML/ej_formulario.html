<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form name="form-suscripcion">
    <fieldset>
        <legend>Formulario de Suscripción</legend>

        <p>Nombre: <input type="text" name="nombre" placeholder="ingrese su nombre" size="40" maxlength="40"></p>
        
        <p>Apellido: <input type="text" name="apellido" placeholder="ingrese su apellido" size="40" maxlength="40"></p>
        
        <p>Sexo: 
            <input type="radio" name="sex" value="masculino"> Masculino 
            <input type="radio" name="sex" value="femenino"> Femenino
        </p>
        
        <p>Edad: <input type="number" name="edad" placeholder="edad" maxlength="3"></p>
        
        <p>Email: <input type="email" name="email" placeholder="usuario@dominio.com" size="40" maxlength="50"></p>
        
        <p>Usuario: <input type="text" name="usuario" placeholder="nombre de usuario" size="40" maxlength="20"></p>
        
        <p>Password: <input type="password" name="password" placeholder="contraseña" size="40" maxlength="20"></p>
        
        <p>Confirmar Password: <input type="password" name="confirm_password" placeholder="contraseña" size="40" maxlength="20"></p>

        <p>Tipo de servicio: 
            <select name="tipo-servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>Tema:
            <input type="checkbox" name="tema" value="politica"> Política 
            <input type="checkbox" name="tema" value="negocios"> Negocios 
            <input type="checkbox" name="tema" value="tecnologia"> Tecnología 
            <input type="checkbox" name="tema" value="salud"> Salud
        </p>

        <p>Agregue un comentario:<br>
            <textarea name="comentario" rows="4" cols="50" placeholder="Escriba su comentario aquí..." maxlength="250"></textarea>
        </p>

        <p><input type="submit" value="Boton de Enviar"></p>
    </fieldset>
</form>

</body>
</html>
