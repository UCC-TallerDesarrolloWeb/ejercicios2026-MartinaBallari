<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de vuelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Buscar vuelos</h4>
            </div>

            <div class="card-body">
                <form>
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipo" id="idaVuelta" checked>
                                <label class="form-check-label" for="idaVuelta">Ida y vuelta</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipo" id="soloIda">
                                <label class="form-check-label" for="soloIda">Solo ida</label>
                            </div>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="origen" class="form-label">Origen</label>
                            <select id="origen" class="form-select">
                                <option selected>Seleccionar origen</option>
                                <option>Córdoba</option>
                                <option>Buenos Aires</option>
                                <option>Mendoza</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="destino" class="form-label">Destino</label>
                            <select id="destino" class="form-select">
                                <option selected>Seleccionar destino</option>
                                <option>Buenos Aires</option>
                                <option>Córdoba</option>
                                <option>Bariloche</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="salida" class="form-label">Fecha de salida</label>
                            <input type="date" id="salida" class="form-control">
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="regreso" class="form-label">Fecha de regreso</label>
                            <input type="date" id="regreso" class="form-control">
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="pasajeros" class="form-label">Pasajeros</label>
                            <select id="pasajeros" class="form-select">
                                <option>1 pasajero</option>
                                <option>2 pasajeros</option>
                                <option>3 pasajeros</option>
                                <option>4 pasajeros</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="clase" class="form-label">Clase</label>
                            <select id="clase" class="form-select">
                                <option>Económica</option>
                                <option>Ejecutiva</option>
                                <option>Primera clase</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">
                                Buscar vuelos
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
