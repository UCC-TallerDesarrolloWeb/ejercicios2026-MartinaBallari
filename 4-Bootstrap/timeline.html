<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Timeline del proyecto</h2>
            <button class="btn btn-primary">Crear tarea</button>
        </div>

        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between">
                <strong>Desarrollo de la aplicación</strong>
                <span class="badge bg-primary">En progreso</span>
            </div>

            <div class="card-body">
                <div class="row align-items-center g-3">
                    <div class="col-12 col-md-3">
                        <strong>Diseño de interfaz</strong>
                        <p class="text-muted mb-0">Responsable: Martina</p>
                    </div>
                    <div class="col-12 col-md-2">
                        <small class="text-muted">01/10/2026</small>
                    </div>
                    <div class="col-12 col-md-5">
                        <div class="progress">
                            <div class="progress-bar bg-success" style="width: 100%">100%</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-2">
                        <span class="badge bg-success">Completada</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div class="row align-items-center g-3">
                    <div class="col-12 col-md-3">
                        <strong>Desarrollo frontend</strong>
                        <p class="text-muted mb-0">Responsable: José</p>
                    </div>
                    <div class="col-12 col-md-2">
                        <small class="text-muted">10/10/2026</small>
                    </div>
                    <div class="col-12 col-md-5">
                        <div class="progress">
                            <div class="progress-bar" style="width: 60%">60%</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-2">
                        <span class="badge bg-primary">En progreso</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div class="row align-items-center g-3">
                    <div class="col-12 col-md-3">
                        <strong>Pruebas</strong>
                        <p class="text-muted mb-0">Responsable: Equipo</p>
                    </div>
                    <div class="col-12 col-md-2">
                        <small class="text-muted">20/10/2026</small>
                    </div>
                    <div class="col-12 col-md-5">
                        <div class="progress">
                            <div class="progress-bar bg-warning" style="width: 0%">0%</div>
                        </div>
                    </div>
                    <div class="col-12 col-md-2">
                        <span class="badge bg-secondary">Pendiente</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
